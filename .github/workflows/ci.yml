name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config rsync libssl-dev libjansson-dev libsqlite3-dev python3 python3-venv
      - name: Build, run integration tests and native baseline
        run: bash scripts/bootstrap.sh --native-test
      - name: Record tool and Python package versions
        if: always()
        run: |
          mkdir -p build/validation
          cmake --version > build/validation/tool-versions.txt
          cc --version >> build/validation/tool-versions.txt
          pkg-config --modversion openssl jansson sqlite3 >> build/validation/tool-versions.txt
          if test -x .venv/bin/python; then .venv/bin/python -m pip freeze > build/validation/python-packages.txt; fi
      - name: Package complete source with pinned dependencies
        run: python3 scripts/package_source.py
      - name: Save complete source and validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-source-and-validation
          if-no-files-found: warn
          path: |
            dist/*.zip
            build/validation/
            build/native/integration/Testing/Temporary/LastTest.log
            build/runs/**/node*.log
