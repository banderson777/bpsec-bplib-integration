name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config rsync libssl-dev libjansson-dev libsqlite3-dev python3 python3-venv ruby valgrind gcovr
      - name: Build, run integration tests and native baseline
        env:
          BPSEC_BSL_TESTS: "ON"
        run: bash scripts/bootstrap.sh --native-test
      - name: Measure integration C and demo Python line and branch coverage
        run: |
          mkdir -p build/validation
          cmake -S integration -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic" -DCFS_BUILD="$PWD/build/native/cfs" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build/coverage -j4
          ctest --test-dir build/coverage --output-on-failure --timeout 60
          ctest --test-dir build/coverage -R '^tcp_cla_regression$' --repeat until-fail:10 --output-on-failure
          gcovr build/coverage --root . --filter 'integration/bplib_tcp_cla_bplib[.]c$' \
            --fail-under-line 100 --fail-under-branch 100
          gcovr build/coverage --root . --filter 'integration/bplib_.*' --filter 'bplib/.*' --filter 'bpnode/.*' \
            --xml-pretty --output build/validation/c-coverage.xml
          .venv/bin/python -m pip install 'coverage>=7.10,<8'
          export PYTHONPATH="$PWD/client-test:$PWD/demo"
          export COVERAGE_RCFILE="$PWD/.github/coverage.ini"
          .venv/bin/coverage run client-test/test_security.py
          .venv/bin/coverage run demo/test_node_health.py
          .venv/bin/coverage run demo/test_five_node_stream.py
          .venv/bin/coverage run demo/test_security.py "$PWD/build/coverage/libbplib_bsl_security.so"
          .venv/bin/coverage combine
          .venv/bin/coverage xml -o build/validation/python-coverage.xml
      - name: Check memory and demo regressions with ASan, LSan and UBSan
        run: |
          cmake -S integration -B build/sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS=-no-pie -DCFS_BUILD="$PWD/build/native/cfs"
          cmake --build build/sanitized --target memory_regression demo_delivery_regression -j4
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build/sanitized --output-on-failure -R '^(memory_regression|demo_delivery_regression)$'
      - name: Record tool and Python package versions
        if: always()
        run: |
          mkdir -p build/validation
          cmake --version > build/validation/tool-versions.txt
          cc --version >> build/validation/tool-versions.txt
          pkg-config --modversion openssl jansson sqlite3 >> build/validation/tool-versions.txt
          if test -x .venv/bin/python; then .venv/bin/python -m pip freeze > build/validation/python-packages.txt; fi
      - name: Package complete source with pinned dependencies
        run: python3 scripts/package_source.py
      - name: Save complete source and validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-source-and-validation
          if-no-files-found: warn
          path: |
            dist/*.zip
            build/validation/
            build/native/integration/Testing/Temporary/LastTest.log
            build/runs/**/node*.log
